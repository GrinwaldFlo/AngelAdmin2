name: PHPUnit

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, pdo_sqlite, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-suggest

      # --no-progress: no line of dots, the log only shows the failures and the summary
      - name: Run PHPUnit suite
        run: vendor/bin/phpunit --colors=always --no-progress --log-junit build/junit.xml

      # Lists only the failed tests in the run summary and as annotations on the test lines
      - name: Report failed tests
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: build/junit.xml
          annotate_only: true
          detailed_summary: true
